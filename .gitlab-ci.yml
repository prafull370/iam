stages:
  - build
  - deploy

build:
  stage: build
  script:
    - dotnet restore IAM.sln
    - dotnet publish IAM_WEB/IAM_WEB.csproj -c Release -o ./publish/web
    - dotnet publish IAM_API/IAM_API.csproj -c Release -o ./publish/api
  artifacts:
    paths:
      - publish/web
      - publish/api
    expire_in: 1 hour
  only:
    - main

deploy:
  stage: deploy
  script:
    # Safety check: don't sync an empty/broken build (--delete would wipe the server)
    - test -f ./publish/web/IAM_WEB.dll
    - test -f ./publish/api/IAM_API.dll

    - echo "Deploying WEB..."
    - rsync -a --delete
        --exclude 'appsettings*.json'
        --exclude '/wwwroot/Assets/'
        ./publish/web/ /home/serveradmin/kanchan/IAM_QC_WEB_V1/

    - echo "Deploying API..."
    - rsync -a --delete
        --exclude 'appsettings*.json'
        ./publish/api/ /home/serveradmin/kanchan/IAM_QC_API_V1/

    - echo "Restarting services..."
    - sudo systemctl restart iamqcweb.service
    - sudo systemctl restart iamqcapi.service
    - echo "Deployment completed."
  only:
    - main
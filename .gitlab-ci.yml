stages:
  - test

runner_connection_test:
  stage: test
  script:
    - echo "========================================="
    - echo "GitLab Runner Connection Test"
    - echo "========================================="
    - echo "Runner is connected successfully!"
    - echo "Hostname:"
    - hostname
    - echo "Current User:"
    - whoami
    - echo "Operating System:"
    - uname -a
    - echo "Dotnet Version:"
    - dotnet --version
    - echo "Working Directory:"
    - pwd
    - echo "========================================="
    - echo "Runner test completed successfully!"
    - echo "========================================="